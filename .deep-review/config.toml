# The review policy of this repository. deep-review reads this file at the
# base of the reviewed change; `deep-review config explain` describes each
# setting.
schema = 1

# dist/ is build output of skill/ and src/, and the golden checkpoint
# fixtures are written by `npm run golden`. A review of either reads
# generated bytes, and the build check rewrites dist/ anyway.
scope.exclude = ["dist/**", "test/fixtures/checkpoints/**"]

# The build check rebuilds dist/ at the tail of a fix run, so the commits
# it makes leave `npm run verify` passing.
checks.build = "npm run build"
checks.typecheck = "npm run typecheck"
checks.lint = "npm run lint"
checks.test = "npm test"

# A fix run of a pull request of this size spent about 55 USD of a 60 USD
# budget and ran out on another; this leaves room to finish.
budget.usd = 120
